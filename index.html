<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Musical Peak</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: black;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 10px;
    }

    .container {
        width: 100%;
        max-width: 500px;
        position: relative;
        overflow: hidden;
        border-radius: 6px;
    }

    .slide {
        position: absolute;
        width: 100%;
        top: 0;
        left: 0;
        opacity: 0;
        transition: opacity 0.8s ease-in-out;
    }

    .slide.active {
        opacity: 1;
        position: relative;
    }

    .slide img {
        width: 100%;
        height: auto;
        max-height: 100vh;
        object-fit: contain;
        display: block;
    }

    /* dots */
    .dots {
        position: absolute;
        bottom: 10px;
        width: 100%;
        display: flex;
        justify-content: center;
        gap: 6px;
    }

    .dot {
        width: 8px;
        height: 8px;
        background: rgba(255,255,255,0.4);
        border-radius: 50%;
        transition: 0.3s;
    }

    .dot.active {
        background: white;
    }

    @media (max-width: 480px) {
        body {
            padding: 8px;
        }

        .container {
            border-radius: 4px;
        }
    }
</style>
</head>

<body>

<div class="container">

    <!-- Slides -->
    <div class="slide active">
        <img src="hero0.jpg" alt="Hero 0">
    </div>

    <div class="slide">
        <img src="hero1.jpg" alt="Hero 1">
    </div>

    <div class="slide">
        <img src="hero2.jpg" alt="Hero 2">
    </div>

    <!-- Dots (auto-handled by JS count) -->
    <div class="dots" id="dots"></div>

</div>

<script>
    let index = 0;
    const slides = document.querySelectorAll('.slide');
    const dotsContainer = document.getElementById('dots');

    // Create dots dynamically
    slides.forEach((_, i) => {
        const dot = document.createElement('div');
        dot.classList.add('dot');
        if (i === 0) dot.classList.add('active');

        dot.addEventListener('click', () => {
            index = i;
            showSlide(index);
        });

        dotsContainer.appendChild(dot);
    });

    const dots = document.querySelectorAll('.dot');

    function showSlide(i) {
        slides.forEach(s => s.classList.remove('active'));
        dots.forEach(d => d.classList.remove('active'));

        slides[i].classList.add('active');
        dots[i].classList.add('active');
    }

    // Auto-slide
    setInterval(() => {
        index = (index + 1) % slides.length;
        showSlide(index);
    }, 3000);
</script>

</body>
</html>
