<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Musical Peak</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: black;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 10px; /* small breathing space on mobile */
    }

    .container {
        width: 100%;
        max-width: 500px; /* keeps it elegant on large screens */
        display: flex;
        justify-content: center;
        align-items: center;
    }

    img {
        width: 100%;
        height: auto;
        max-height: 100vh;
        object-fit: contain;
        border-radius: 6px; /* subtle polish */
    }

    @media (max-width: 480px) {
        body {
            padding: 8px;
        }

        img {
            border-radius: 4px;
        }
    }
</style>
</head>

<body>

<div class="container">
    <img src="hero.jpg" alt="The Musical Peak">
</div>

</body>
</html>
