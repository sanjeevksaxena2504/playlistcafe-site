<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Musical Peak</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: black;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 10px;
        overflow: hidden;
    }

    .container {
        width: 100%;
        max-width: 500px;
        position: relative;
        overflow: hidden;
        border-radius: 6px;
    }

    .carousel {
        display: flex;
        transition: transform 0.5s ease-in-out;
        width: 200%; /* 2 images */
    }

    .slide {
        width: 100%;
        flex-shrink: 0;
    }

    .slide img {
        width: 100%;
        height: auto;
        max-height: 100vh;
        object-fit: contain;
        display: block;
    }

    /* Dots indicator */
    .dots {
        position: absolute;
        bottom: 10px;
        width: 100%;
        display: flex;
        justify-content: center;
        gap: 6px;
    }

    .dot {
        width: 8px;
        height: 8px;
        background: rgba(255,255,255,0.4);
        border-radius: 50%;
        transition: 0.3s;
    }

    .dot.active {
        background: white;
    }

    @media (max-width: 480px) {
        body {
            padding: 8px;
        }
        .container {
            border-radius: 4px;
        }
    }
</style>
</head>

<body>

<div class="container">
    <div class="carousel" id="carousel">
        <div class="slide">
            <img src="hero1.jpg" alt="The Musical Peak">
        </div>
        <div class="slide">
            <img src="hero2.jpg" alt="The Musical Peak">
        </div>
    </div>

    <div class="dots">
        <div class="dot active"></div>
        <div class="dot"></div>
    </div>
</div>

<script>
    let index = 0;
    const carousel = document.getElementById('carousel');
    const dots = document.querySelectorAll('.dot');

    function updateCarousel() {
        carousel.style.transform = `translateX(-${index * 100}%)`;
        dots.forEach(dot => dot.classList.remove('active'));
        dots[index].classList.add('active');
    }

    // Auto slide every 3 seconds
    setInterval(() => {
        index = (index + 1) % 2;
        updateCarousel();
    }, 3000);

    // Swipe support (mobile)
    let startX = 0;

    carousel.addEventListener('touchstart', (e) => {
        startX = e.touches[0].clientX;
    });

    carousel.addEventListener('touchend', (e) => {
        let endX = e.changedTouches[0].clientX;

        if (startX - endX > 50) {
            index = (index + 1) % 2;
        } else if (endX - startX > 50) {
            index = (index - 1 + 2) % 2;
        }

        updateCarousel();
    });
</script>

</body>
</html>
