<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Musical Peak</title>

<style>
body, html {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: Georgia, serif;
}

.hero {
    background: url('hero.jpg') no-repeat center center/cover;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    color: white;
    position: relative;
}

.overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.25);
}

.content {
    position: relative;
    z-index: 2;
    max-width: 800px;
    padding: 20px;
}

h1 {
    font-size: 48px;
    margin: 10px 0;
}

h2 {
    margin: 5px 0;
    font-weight: normal;
}

p {
    margin: 10px 0;
}

.coming {
    margin-top: 20px;
    font-size: 28px;
    font-weight: bold;
}

@media (max-width: 600px) {
    h1 { font-size: 28px; }
    .coming { font-size: 22px; }
}
</style>

</head>

<body>

<div class="hero">
    <div class="overlay"></div>

    <div class="content">
        <h2>playlistcafe.in</h2>
        <h1>THE MUSICAL PEAK</h1>
        <p>Where Music Meets the Mountains</p>
        <p>Music. Nature. Soulful Brews.</p>
        <div class="coming">Opening Soon</div>
    </div>
</div>

</body>
</html>
