<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Musical Peak</title>

<style>
    body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #000;
        font-family: Georgia, serif;
    }

    .hero {
        position: relative;
        width: 100%;
        height: 100vh;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .bg-img {
        width: 100%;
        height: 100%;
        object-fit: contain; /* KEY: keeps full image visible */
        background: black;
    }

    .overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.25);
    }

    .content {
        position: absolute;
        text-align: center;
        color: white;
        z-index: 2;
        padding: 20px;
    }

    h1 {
        font-size: 48px;
        margin: 10px 0;
        text-shadow: 0 2px 10px rgba(0,0,0,0.6);
    }

    h2 {
        margin: 5px 0;
        font-weight: normal;
        text-shadow: 0 2px 8px rgba(0,0,0,0.6);
    }

    p {
        margin: 10px 0;
        text-shadow: 0 2px 8px rgba(0,0,0,0.6);
    }

    .coming {
        margin-top: 20px;
        font-size: 28px;
        font-weight: bold;
        text-shadow: 0 2px 10px rgba(0,0,0,0.6);
    }

    @media (max-width: 600px) {
        h1 {
            font-size: 28px;
        }
        .coming {
            font-size: 22px;
        }
    }
</style>
</head>

<body>

<div class="hero">
    <img src="hero.jpg" class="bg-img" alt="The Musical Peak">

    <div class="overlay"></div>

    <div class="content">
        <h2>playlistcafe.in</h2>
        <h1>THE MUSICAL PEAK</h1>
        <p>Where Music Meets the Mountains</p>
        <p>Music. Nature. Soulful Brews.</p>
        <div class="coming">Opening Soon</div>
    </div>
</div>

</body>
</html>
